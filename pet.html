<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T3 DeskCat</title>
    <style>
      * {
        box-sizing: border-box;
      }
      ::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden !important;
        background: transparent !important;
        user-select: none;
        -webkit-user-select: none;
      }
      #pet-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #pet-canvas:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <canvas id="pet-canvas"></canvas>
    <script type="module" src="/src/pet.ts"></script>
  </body>
</html>
