<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="額度" />
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>T3 DeskCat 額度</title>
<style>
:root {
  --bg: #f2f2f7; --card: #ffffff; --sep: rgba(60, 60, 67, 0.14);
  --label: #000; --label-2: rgba(60, 60, 67, 0.62); --label-3: rgba(60, 60, 67, 0.36);
  --fill: rgba(120, 120, 128, 0.14);
  --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30;
  --claude: #d97757; --ag: #0a84ff; --codex: #30b06e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --card: #1c1c1e; --sep: rgba(84, 84, 88, 0.5);
    --label: #fff; --label-2: rgba(235, 235, 245, 0.6); --label-3: rgba(235, 235, 245, 0.3);
    --fill: rgba(120, 120, 128, 0.32);
    --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --red: #ff453a;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--label);
  font: 15px/1.35 -apple-system, BlinkMacSystemFont, "PingFang TC", "Helvetica Neue", sans-serif;
  padding: calc(env(safe-area-inset-top) + 8px) max(14px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(14px, env(safe-area-inset-left));
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
}
header { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 4px 12px; }
h1 { font-size: 32px; font-weight: 700; letter-spacing: 0.2px; }
#updated { font-size: 12px; color: var(--label-3); font-variant-numeric: tabular-nums; }
.card { background: var(--card); border-radius: 18px; }
.sec { font-size: 13px; font-weight: 600; color: var(--label-2); margin: 20px 6px 8px; display: flex; justify-content: space-between; }
.sec span:last-child { font-weight: 400; }
.tone-good { color: var(--green); } .tone-warn { color: var(--orange); } .tone-bad { color: var(--red); }
.s-good { stroke: var(--green); } .s-warn { stroke: var(--orange); } .s-bad { stroke: var(--red); } .s-used { stroke: var(--blue); }
.ring { display: block; transform: rotate(-90deg); }
.ring .track { stroke: var(--fill); }
.ring-wrap { position: relative; display: grid; place-items: center; }
.ring-wrap .ring-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; }
.ring-txt .cap { font-size: 11px; color: var(--label-2); font-weight: 500; margin-top: 2px; }

/* hero */
.hero { display: flex; align-items: center; gap: 20px; padding: 18px 20px; }
.hero .ring-txt { font-size: 32px; }
.hero .ring-txt small { font-size: 15px; font-weight: 600; }
.stats { flex: 1; display: grid; gap: 12px; }
.stat { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--label-2); }
.stat b { font-size: 20px; color: var(--label); font-weight: 650; font-variant-numeric: tabular-nums; }
.stat b.tone-bad { color: var(--red); } .stat b.tone-warn { color: var(--orange); }

/* picks */
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.pick { padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.pick .pn { flex: 1; min-width: 0; }
.pick .pn b { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .pn span { font-size: 12px; color: var(--label-2); }
.pick .pn span.soon { color: var(--orange); }
.pick .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pick .big small { font-size: 13px; }

/* accounts: list like the desktop panel */
.list { padding: 0 14px; }
.acc { padding: 14px 0 12px; border-top: 0.5px solid var(--sep); }
.acc:first-child { border-top: none; }
.acc-head { display: flex; align-items: center; gap: 9px; min-width: 0; }
.acc-head .name { font-weight: 650; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.plan { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: var(--fill); color: var(--label-2); flex: 0 0 auto; }
.icon { flex: 0 0 32px; width: 32px; height: 32px; border-radius: 9px; color: #fff; font-weight: 700; font-size: 15px; display: grid; place-items: center; }
.icon.claude { background: var(--claude); } .icon.antigravity { background: var(--ag); } .icon.codex { background: var(--codex); }
.icon.has-img { background: none; overflow: hidden; }
.icon.has-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.extras { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-size: 12px; color: var(--label-2); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; min-width: 0; }
.extras .fc { font-weight: 600; }
.fc.warn { color: var(--orange); } .fc.bad { color: var(--red); }
.status { margin-top: 10px; font-size: 13px; color: var(--red); }
.status.cool { color: var(--orange); }
.last-known .wins { opacity: 0.5; }
.wins { margin-top: 8px; }
.wrow { padding: 6px 0 2px; }
.wl { display: flex; align-items: baseline; gap: 8px; font-size: 15px; }
.wl b { font-weight: 650; white-space: nowrap; }
.wl b .warn { color: var(--orange); } .wl b .bad { color: var(--red); }
.wl span { flex: 1; text-align: right; color: var(--label-2); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wl i { font-style: normal; color: var(--label-2); font-size: 14px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--fill); margin-top: 6px; overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 3px; }
.b-good { background: var(--green); } .b-warn { background: var(--orange); } .b-bad { background: var(--red); } .b-used { background: var(--blue); }
.note { font-size: 12px; color: var(--label-3); margin-top: 6px; }
.note.warn { color: var(--orange); }
.notice { margin: 0 0 10px; padding: 10px 14px; border-radius: 14px; font-size: 14px; background: color-mix(in srgb, var(--orange) 16%, transparent); }
.foot { text-align: center; font-size: 12px; color: var(--label-3); margin-top: 20px; }
.empty { padding: 28px 16px; text-align: center; color: var(--label-2); grid-column: 1 / -1; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>額度</h1>
  <span id="updated"></span>
</header>
<div id="notice" class="notice hidden"></div>
<div class="card hero" id="hero"></div>
<section id="sec-picks" class="hidden">
  <div class="sec"><span>推薦使用</span></div>
  <div class="picks" id="picks"></div>
</section>
<section>
  <div class="sec"><span>所有帳號</span><span id="count"></span></div>
  <div class="card list" id="accounts"><div class="empty">載入中…</div></div>
</section>
<script>
"use strict";
let data = null;
let fetchedAt = 0;
let lastError = null;
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const nowSec = () => Date.now() / 1000;
const WEEKDAYS = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
const GLYPH = { claude: "C", antigravity: "A", codex: "G" };
const PROVIDER = { claude: "Claude", antigravity: "Antigravity", codex: "ChatGPT" };

function tone(pct) { const w = data?.workingThreshold ?? 70, s = data?.sleepingThreshold ?? 20; return pct > w ? "good" : pct >= s ? "warn" : "bad"; }
function timeOf(d) { return d.toLocaleTimeString("zh-TW", { hour: "numeric", minute: "2-digit", hour12: true }); }
function when(ts) {
  const d = new Date(ts * 1000), now = new Date();
  if (d.toDateString() === now.toDateString()) return timeOf(d);
  const t = new Date(now); t.setDate(now.getDate() + 1);
  if (d.toDateString() === t.toDateString()) return `明天${timeOf(d)}`;
  return `${WEEKDAYS[d.getDay()]}${timeOf(d)}`;
}
function windowName(label, provider) {
  const [base, ...rest] = label.split(" ");
  const pool = rest.join(" ");
  if (/^(Argon|3P)$/.test(base) && rest.length) return `${base === "3P" ? "Claude/GPT" : base} · ${windowName(pool, provider)}`;
  const b = base === "週" ? "Wk" : base;
  return pool ? `${b} · ${pool}` : b;
}
function age(ts) {
  const m = Math.max(0, Math.round((nowSec() - ts) / 60));
  return m < 1 ? "剛剛" : m < 60 ? `${m} 分鐘前` : `${Math.floor(m / 60)} 小時前`;
}
function tokens(n) {
  return n >= 1e9 ? `${(n / 1e9).toFixed(1)}B` : n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}K` : String(n);
}
function money(v) { return `$${v < 10 ? v.toFixed(2) : v.toFixed(1)}`; }

function ring(pct, size, stroke, cls) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, pct));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"/>
    <circle class="${cls}" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - v / 100)).toFixed(2)}"/></svg>`;
}
function hm(ts) {
  const d = new Date(ts * 1000), now = new Date(), tmr = new Date(now);
  tmr.setDate(now.getDate() + 1);
  const t = `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  if (d.toDateString() === now.toDateString()) return t;
  return `${d.toDateString() === tmr.toDateString() ? "明天" : WEEKDAYS[d.getDay()]} ${t}`;
}
function fcInfo(f) {
  if (!f || f.exhaustAt <= nowSec()) return null;
  const mins = (f.exhaustAt - nowSec()) / 60;
  const gap = f.resetAt ? Math.max(0, f.resetAt - f.exhaustAt) : null;
  const lv = (gap != null && gap >= 7200) || mins < 60 ? "bad" : "warn";
  return { lv, at: mins < 60 ? `${Math.max(1, Math.round(mins))}m 後` : hm(f.exhaustAt), gap };
}
function gapText(g) { return g < 3600 ? `${Math.max(1, Math.round(g / 60))}m` : `${Math.round(g / 1800) / 2}h`; }

function relReset(resetAt) {
  const secs = resetAt - nowSec();
  if (secs <= 0) return "即將重設";
  const m = Math.floor(secs / 60), h = Math.floor(m / 60);
  if (h >= 24) return `${Math.floor(h / 24)} 天 ${h % 24} 小時後重設`;
  if (h > 0) return `${h} 小時 ${m % 60} 分後重設`;
  return `${Math.max(1, m)} 分鐘後重設`;
}

function accountHtml(a) {
  const idle = a.status === "idle";
  const idleWithData = idle && a.windows.length > 0;
  const expiredLastKnown = a.status === "expired" && a.windows.length > 0;
  const plan = a.plan ? `<span class="plan">${esc(a.plan)}</span>` : "";
  const fi = fcInfo(a.forecast);
  const u = a.usage && a.usage.requests > 0 ? a.usage : null;
  const usage = u ? `<span>今日 ${tokens(u.totalTokens)} · ${u.requests} 次${u.costUsd != null ? " · " + money(u.costUsd) : ""}</span>` : "";
  const fc = fi ? `<span class="fc ${fi.lv}">⚠ ${esc(windowName(a.forecast.label, a.provider))} ${fi.at} 耗盡${fi.gap ? " · " + gapText(fi.gap) : ""} · ${a.forecast.ratePerHour}%/h</span>` : "";
  const extras = usage || fc ? `<div class="extras">${usage}${fc}</div>` : "";
  let body = "";
  if (idle && !idleWithData) body = `<div class="status cool">${esc(a.error || "閒置中，用一次即更新")}</div>`;
  else if (a.status === "expired" && !expiredLastKnown) body = `<div class="status">${esc(a.error || "授權已過期，請在 T3 重新登入")}</div>`;
  else if (a.status === "cooldown") body = `<div class="status cool">${esc(a.error || "查詢受限，稍後自動重試")}</div>`;
  else if (a.status !== "ok" && a.status !== "stale" && !expiredLastKnown && !idleWithData) body = `<div class="status">${esc(a.error || "讀取失敗")}</div>`;
  else {
    const used = data.usageDisplay === "used";
    const all = [...a.windows, ...(a.extraWindows || [])];
    body = all.length ? `<div class="wins">${all.map((w) => {
      const rem = Math.max(0, Math.min(100, w.remainingPercent));
      const t = tone(rem), val = used ? 100 - rem : rem;
      const cls = used && t !== "bad" ? "used" : t;
      const mark = fi && a.forecast.label === w.label ? ` <span class="${fi.lv}">⚠</span>` : "";
      return `<div class="wrow"><div class="wl"><b>${esc(windowName(w.label, a.provider))}${mark}</b><span>${w.resetAt ? esc(relReset(w.resetAt)) : ""}</span><i>${used ? "用 " : "剩 "}${val}%</i></div>
        <div class="bar"><span class="b-${cls}" style="width:${val}%"></span></div></div>`;
    }).join("")}</div>` : `<div class="status cool">沒有用量資料</div>`;
    if (expiredLastKnown) body += `<div class="note warn">憑證過期，顯示最後一次的數字</div>`;
    else if (a.status === "stale" && nowSec() - a.updatedAt >= 600) body += `<div class="note">資料時間 ${age(a.updatedAt)}</div>`;
  }
  const titleAttr = idleWithData ? ` title="${esc(`${a.name} · ${age(a.updatedAt)}`)}"` : "";
  return `<div class="acc ${expiredLastKnown ? "last-known" : ""}">
    <div class="acc-head">${icon(a.id, a.provider)}<span class="name"${titleAttr}>${esc(a.name)}</span>${plan}${extras}</div>${body}</div>`;
}

function icon(id, provider) {
  const av = data?.avatars?.[id];
  if (av && /^data:image\//.test(av)) return `<span class="icon has-img"><img src="${esc(av)}" alt=""></span>`;
  return `<span class="icon ${provider}">${GLYPH[provider] || "?"}</span>`;
}

function render() {
  if (!data) return;
  const n = $("notice");
  const stale = lastError && nowSec() - fetchedAt > 90;
  if (stale) { n.textContent = `連不到電腦（${lastError}）。請確認電腦開著、Tailscale 已連線。`; n.classList.remove("hidden"); }
  else if (data.offline) { n.textContent = "電腦暫時抓不到最新額度，顯示的是最後一次取得的數字。"; n.classList.remove("hidden"); }
  else n.classList.add("hidden");

  const live = data.accounts.filter((a) => a.status === "ok" || a.status === "stale" || (a.status === "idle" && a.windows.length > 0)).length;
  const fcs = data.accounts.map((a) => fcInfo(a.forecast)).filter(Boolean);
  const fcTone = fcs.some((f) => f.lv === "bad") ? "tone-bad" : fcs.length ? "tone-warn" : "";
  const sc = data.overallScore;
  $("hero").innerHTML = `<div class="ring-wrap">${ring(sc, 118, 11, "s-" + tone(sc))}<span class="ring-txt"><span>${sc}<small>%</small></span><span class="cap">總剩餘</span></span></div>
    <div class="stats">
      <div class="stat"><span>今日花費</span><b>${data.totalCostUsd != null ? money(data.totalCostUsd) : "—"}</b></div>
      <div class="stat"><span>在線帳號</span><b>${live}/${data.accounts.length}</b></div>
      <div class="stat"><span>將提前耗盡</span><b class="${fcTone}">${fcs.length}</b></div>
    </div>`;

  $("sec-picks").classList.toggle("hidden", !data.picks.length);
  $("picks").innerHTML = data.picks.map((p) => `
    <div class="card pick">${icon(p.accountId, p.provider)}
      <div class="pn"><b>${esc(p.accountName)}</b><span class="${p.useBeforeReset ? "soon" : ""}">${p.useBeforeReset ? "即將重設 · 優先使用" : PROVIDER[p.provider] || ""}</span></div>
      <span class="big tone-${tone(p.effectiveRemaining)}">${p.effectiveRemaining}<small>%</small></span></div>`).join("");

  $("count").textContent = `${live}/${data.accounts.length} 在線` + (data.hidden ? ` · 隱藏 ${data.hidden}` : "");
  $("accounts").innerHTML = data.accounts.length ? data.accounts.map(accountHtml).join("") : `<div class="empty">電腦上沒有找到帳號</div>`;
  $("updated").textContent = `更新 ${new Date(data.updatedAt * 1000).toLocaleTimeString("zh-TW", { hour12: false, hour: "2-digit", minute: "2-digit" })}`;
}

async function load() {
  try {
    const r = await fetch("/api/snapshot", { cache: "no-store" });
    if (r.status === 503) { lastError = "電腦剛啟動，額度載入中"; return; }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
    fetchedAt = nowSec();
    lastError = null;
  } catch (e) {
    lastError = e.message === "Load failed" || e.message === "Failed to fetch" ? "網路錯誤" : e.message;
    if (!data) $("accounts").innerHTML = `<div class="empty">連不到電腦（${esc(lastError)}）<br>請確認電腦開著、Tailscale 已連線。</div>`;
  } finally {
    render();
  }
}

load();
setInterval(load, 30000);
setInterval(render, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
window.addEventListener("pageshow", load);
</script>
</body>
</html>
