<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T3 DeskCat Bubble</title>
    <style>
      :root {
        --surface: #f9f9f9;
        --ink: #1a1a1a;
        --ink-2: #5c5c5c;
        --line: rgba(0, 0, 0, 0.1);
        --warn-ink: #a25e00;
        --bad-ink: #c42b1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #2c2c2c;
          --ink: #ffffff;
          --ink-2: #c5c5c5;
          --line: rgba(255, 255, 255, 0.1);
          --warn-ink: #e3b341;
          --bad-ink: #ff6b7a;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding: 4px 6px 8px;
      }
      body.below {
        align-items: flex-start;
        padding: 8px 6px 4px;
      }
      .bubble {
        position: relative;
        max-width: 100%;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
        color: var(--ink);
        opacity: 0;
        transform: translateY(2px);
        transition: opacity 0.12s ease, transform 0.12s ease;
      }
      .bubble.on {
        opacity: 1;
        transform: none;
      }
      .tail {
        position: absolute;
        width: 8px;
        height: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-top: 0;
        border-left: 0;
        bottom: -5px;
        transform: translateX(-50%) rotate(45deg);
      }
      body.below .tail {
        bottom: auto;
        top: -5px;
        transform: translateX(-50%) rotate(225deg);
      }
      .l1 {
        font-size: 13px;
        font-weight: 500;
        line-height: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-variant-numeric: tabular-nums;
      }
      .l2 {
        font-size: 12px;
        line-height: 16px;
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-variant-numeric: tabular-nums;
      }
      .warn {
        color: var(--warn-ink);
      }
      .bad {
        color: var(--bad-ink);
      }
    </style>
  </head>
  <body>
    <div class="bubble" id="bubble"><div id="lines"></div><i class="tail" id="tail"></i></div>
    <script type="module" src="/src/bubble.ts"></script>
  </body>
</html>
